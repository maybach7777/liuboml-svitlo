name: test-api
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: api test 3
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B="https://api-voe-poweron.inneti.net"
          for P in "/api/actual_gpv_graphs" "/api/city_gpvs?page=1" "/api/street_gpvs?page=1" "/api/pw_address_queues?page=1"; do
            echo "=================== $P"
            curl -sL -A "$UA" -H "Accept: application/ld+json" -o out.txt -w "STATUS %{http_code} SIZE %{size_download}\n" "$B$P" || true
            head -c 3000 out.txt; echo
          done
