name: test-volyn
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: curl test
        run: |
          curl -sSL -A "Mozilla/5.0" -o page.html -w "STATUS %{http_code}\n" "https://energy.volyn.ua/spozhyvacham/perervy-u-elektropostachanni/chomu-nemaie-elektropostachannia/" || true
          ls -la page.html || true
      - name: browser test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          cat > t.py <<'EOF'
          from playwright.sync_api import sync_playwright
          URL = "https://energy.volyn.ua/spozhyvacham/perervy-u-elektropostachanni/chomu-nemaie-elektropostachannia/"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(locale="uk-UA")
              pg.on("request", lambda r: print("REQ", r.method, r.url, r.post_data) if r.method == "POST" else None)
              pg.goto(URL, timeout=60000)
              pg.get_by_placeholder("Вкажіть населений пункт").fill("Любомль")
              pg.get_by_placeholder("назву вулиці").fill("Завальська")
              pg.get_by_text("Вибрати").first.click()
              pg.wait_for_timeout(6000)
              print("URL AFTER:", pg.url)
              open("result.html", "w", encoding="utf-8").write(pg.content())
              pg.screenshot(path="result.png", full_page=True)
              b.close()
          EOF
          python t.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: |
            page.html
            result.html
            result.png
